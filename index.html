                proverbs: {
                    name: 'Παροιμίες',
                    phrases: [
                        {cypriot: 'Όποιος σιερέται να φάει, σιερέται να δουλέψει', english: 'Who knows how to eat, knows how to work', phonetic: 'Opios sieretai na fai, sieretai na doulepsi'},
                        {cypriot: 'Η γλώσσα κόκκαλα εν έσιει τζιαι κόκκαλα τσακίζει', english: 'The tongue has no bones but breaks bones', phonetic: 'I glossa kokkala en eshi tziai kokkala tsakizi'},
                        {cypriot: 'Άμαν θέλεις να μάθεις τον άνθρωπον, βάλε τον αφέντην', english: 'If you want to know someone, give them power', phonetic: 'Aman thelis na mathis ton anthropon, vale ton afentin'},
                        {cypriot: 'Που την πολλήν αγάπην βκαίννει τζιαι το μάτιν', english: 'From too much love, even the eye comes out', phonetic: 'Pou tin pollin agapin vkenni tziai to matin'},
                        {cypriot: 'Ο τεμπέλης εν πκιο κουρασμένος', english: 'The lazy one is more tired', phonetic: 'O tembelis en pkio kourasmenos'},
                        {cypriot: 'Όποιος εν με τον χωρκάτην εν με τον αφέντην', english: "Who's not with the villager is with the master", phonetic: 'Opios en me ton horkatin en me ton afentin'},
                        {cypriot: 'Το ψέμαν έσιει κοντά ποδκιά', english: 'Lies have short legs', phonetic: 'To pseman eshi konta podkia'},
                        {cypriot: 'Ο λόγος εν χρυσός τζιαι η σιωπή διαμάντιν', english: 'Speech is gold and silence is diamond', phonetic: 'O logos en hrisos tziai i siopi diamantin'},
                        {cypriot: 'Κάλλιον αργά παρά ποτέ', english: 'Better late than never', phonetic: 'Kallion arga para pote'},
                        {cypriot: 'Όποιος πάει με τα ποδκιά του εν γυρίζει άδειος', english: 'Who goes on foot doesn\'t return empty', phonetic: 'Opios pai me ta podkia tou en yirizi adios'},
                        {cypriot: 'Η καλή μέρα που το πρωίν φαίνεται', english: 'A good day shows from the morning', phonetic: 'I kali mera pou to proin fenete'},
                        {cypriot: 'Άλλα λαλεί η αλεπού τζιαι άλλα ο αλεπούδος', english: 'The female fox says one thing, the male fox another', phonetic: 'Alla lali i alepou tziai alla o alepoudos'},
                        {cypriot: 'Το πολύ το κύριε ελέησον το βαρκάται τζιαι ο Θεός', english: 'Even God gets tired of too much "Lord have mercy"', phonetic: 'To poli to kirie eleison to varkate tziai o Theos'},
                        {cypriot: 'Που μικρόν ρυάτζιν μεγάλη φασαρία', english: 'From a small stream, big noise', phonetic: 'Pou mikron riatzin megali fasaria'},
                        {cypriot: 'Ο καθένας με τον πόνον του', english: 'Everyone with their own pain', phonetic: 'O kathenas me ton ponon tou'},
                        {cypriot: 'Όποιος έσιει την τύχην του, έσιει τζιαι την δυστυχίαν του', english: 'Who has his fortune, also has his misfortune', phonetic: 'Opios eshi tin tihin tou, eshi tziai tin distihian tou'},
                        {cypriot: 'Ο πεινασμένος καρβέλια ονειρεύκεται', english: 'The hungry one dreams of bread loaves', phonetic: 'O peinasmenos karvelia onirevkete'},
                        {cypriot: 'Που ξένον χοράφιν εν βάλλεις αμπέλιν', english: 'You don\'t plant a vineyard in someone else\'s field', phonetic: 'Pou ksenon horafin en vallis ambelin'},
                        {cypriot: 'Όποιος φτύννει ψηλά, στα μούτρα του πέφτει', english: 'Who spits high, it falls on his face', phonetic: 'Opios ftinni psila, sta moutra tou pefti'},
                        {cypriot: 'Η πολλή σοφία φέρνει τρέλλαν', english: 'Too much wisdom brings madness', phonetic: 'I polli sofia ferni trellan'}
                    ]
                }
            };

            const getFilteredPhrases = () => {
                const phrases = selectedCategory === 'favorites' 
                    ? Object.values(categories).flatMap(c => c.phrases).filter(p => favorites.includes(p.cypriot))
                    : categories[selectedCategory].phrases;
                
                if (!searchTerm) return phrases;
                return phrases.filter(p => 
                    p.cypriot.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.english.toLowerCase().includes(searchTerm.toLowerCase())
                );
            };

            const toggleFavorite = (phrase) => {
                setFavorites(prev => 
                    prev.includes(phrase) ? prev.filter(f => f !== phrase) : [...prev, phrase]
                );
            };

            const totalPhrases = Object.values(categories).reduce((sum, cat) => sum + cat.phrases.length, 0);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-4">
                    <div className="max-w-5xl mx-auto">
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">🇨🇾 Κυπριακή Διάλεκτος - Cypriot Greek Phrases</h1>

                            <div className="grid grid-cols-4 gap-4 mb-4 text-center">
                                <div>
                                    <div className="text-2xl font-bold text-blue-600">{totalPhrases}</div>
                                    <div className="text-xs text-gray-500">Total Phrases</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-blue-600">{Object.keys(categories).length}</div>
                                    <div className="text-xs text-gray-500">Categories</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-blue-600">{favorites.length}</div>
                                    <div className="text-xs text-gray-500">Favorites</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-blue-600">{getFilteredPhrases().length}</div>
                                    <div className="text-xs text-gray-500">Filtered</div>
                                </div>
                            </div>

                            <input
                                type="text"
                                placeholder="🔍 Search phrases in Cypriot, English..."
                                className="w-full p-3 border rounded-lg"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>

                        <div className="grid grid-cols-3 md:grid-cols-4 gap-2 mb-6">
                            {Object.entries(categories).map(([key, cat]) => (
                                <button
                                    key={key}
                                    onClick={() => setSelectedCategory(key)}
                                    className={`p-2 text-sm rounded-lg text-white font-medium ${
                                        selectedCategory === key ? 'bg-blue-500' : 'bg-gray-400'
                                    }`}
                                >
                                    {cat.name}
                                    <span className="block text-xs">({cat.phrases.length})</span>
                                </button>
                            ))}
                            <button
                                onClick={() => setSelectedCategory('favorites')}
                                className={`p-2 text-sm rounded-lg text-white font-medium ${
                                    selectedCategory === 'favorites' ? 'bg-red-500' : 'bg-gray-400'
                                }`}
                            >
                                ❤️ Αγαπημένα
                                <span className="block text-xs">({favorites.length})</span>
                            </button>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h2 className="text-xl font-bold mb-4">
                                {selectedCategory === 'favorites' ? 'Αγαπημένα' : categories[selectedCategory]?.name}
                            </h2>
                            <div className="space-y-3 max-h-[500px] overflow-y-auto">
                                {getFilteredPhrases().length === 0 ? (
                                    <p className="text-gray-500 text-center py-8">
                                        {selectedCategory === 'favorites' ? 'No favorites yet!' : 'No phrases found.'}
                                    </p>
                                ) : (
                                    getFilteredPhrases().map((phrase, idx) => (
                                        <div key={idx} className="border-b pb-3 flex justify-between hover:bg-gray-50 p-2 rounded">
                                            <div className="flex-1">
                                                <p className="text-lg font-semibold">{phrase.cypriot}</p>
                                                <p className="text-sm text-gray-500 italic">{phrase.phonetic}</p>
                                                <p className="text-gray-700">{phrase.english}</p>
                                            </div>
                                            <button
                                                onClick={() => toggleFavorite(phrase.cypriot)}
                                                className="text-2xl ml-2"
                                            >
                                                {favorites.includes(phrase.cypriot) ? '❤️' : '🤍'}
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
