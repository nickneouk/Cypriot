    <script>
        // Dark mode detection

                document.documentElement.classList.add('dark');

                document.documentElement.classList.remove('dark');

        // Proverbs data with English translations
        const proverbs = {
            "Α": [
                { greek: "Αδκειασερός παπάς, θάβκει τζαι τους ζωντανούς.", english: "A priest with no work buries even the living.", note: "Someone with nothing to do does useless things." },
                { greek: "Άθρωπος αθρώπου μοιάζει.", english: "Person resembles person.", note: "People are alike." },
                { greek: "Άλλα'ν τ' αμμάθκια του λαού τζι άλλα του κουκουβκιάου, τζαι άλλα έν' του αλουπού που κάμνει πάου πάου.", english: "Different are the eyes of the hare, different of the owl, and different of the fox that cries 'pao pao'.", note: "Everyone sees things differently." },
                { greek: "Αλλού τον τρώει τζαι αλλού κνίθεται.", english: "It bites him in one place and he scratches in another.", note: "Someone else is to blame but he complains elsewhere." },
                { greek: "Άλλαξεν ο Μανωλιός τζι έβαλεν τα ρούχα του αλλοιώς.", english: "Manolios changed and put his clothes on differently.", note: "Someone may change superficially but remains the same inside." },
                { greek: "Άμαν εν πάει ο Μωάμεθ εις το βουνόν, πάει το βουνόν εις τον Μωάμεθ.", english: "When Mohammed doesn't go to the mountain, the mountain goes to Mohammed.", note: "If you can't achieve something one way, try another." },
                { greek: "Αν έν' μηλιά εν να ανθίσει.", english: "If it's an apple tree, it will bloom.", note: "True nature will always reveal itself." },

                { greek: "Αν κάμει ο Μάρτης δκυό νερά τζαι ο Απρίλης άλλον, εν να'ν χαρά σε τζείντον γεωργόν πό 'σιει πολλά σπαρμένα.", english: "If March brings two rains and April another, it will be joy for the farmer who has much sown.", note: "Good weather brings good harvest." },
                { greek: "Άκουε μεγάλον αμπέλιν τζαι παίρνε μιτσίν καλάθι.", english: "Hear about a big vineyard but take a small basket.", note: "Don't believe everything you hear; be cautious." },

                { greek: "Αλλού σε τρώει τζαι αλλού κνήθεσαι.", english: "It bites you in one place and you scratch in another.", note: "You're addressing the wrong issue." },
                { greek: "Αλλού σπέρνουν τους, δαμαί γιωρκούν τους.", english: "They sow them in one place and cultivate them in another.", note: "Things are done inconsistently." },
                { greek: "Άμαν επειράξαν την κοτζιάκαρην, έβαλεν ρομανίσιν μετά.", english: "When they teased the hen, she laid a pomegranate afterwards.", note: "Unexpected results from provocation." },
                { greek: "Ανάγυιωσ' τον κολλιόν να σου βκάλει τ' αμμάθκια σου.", english: "Raise your child to have him poke your eyes out.", note: "Sometimes children you raise cause you problems." },
                { greek: "Αντί να τρίζει η άμαξα, τρίζει ο αμαξηλάτης.", english: "Instead of the cart creaking, the cart driver creaks.", note: "The complainer is in the wrong place." },
                { greek: "Από'ν αππέξω του χορού, πολλά τραούδκια ξέρει.", english: "From outside the dance, he knows many songs.", note: "Those who don't participate think they know everything." },
                { greek: "Από 'ν ακούει, ταιρκάζει.", english: "When he doesn't hear, he makes mistakes.", note: "Not hearing the full story leads to wrong conclusions." },

                { greek: "Από 'ν θέλει να πά' στον μύλον, πέντε μέρες κοσσινίζει.", english: "Who doesn't want to go to the mill sifts for five days.", note: "Who doesn't want to do something finds endless excuses." },
                { greek: "Από 'ν φορτώνει ῾π' όσσω σου, τάνα του να φορτώσει.", english: "If it doesn't load on your back, let him load it himself.", note: "If it doesn't harm you, don't worry about it." },
                { greek: "Από 'ν μπορεί να δέρει τον γάρον, δέρνει τον σαμά��.", english: "Who can't beat the donkey beats the saddle.", note: "Taking out anger on the wrong target." },
                { greek: "Από 'ν σε ξέρει, ακριβά σε γοράζει.", english: "Who doesn't know you buys you at a high price.", note: "Strangers think you're better than you are." },

                { greek: "Άπου σοδκιάζει τριάντα δκυό τζαι ξοδκιάζει τράντα, έν' νοικοτζύρης πάντα. Άπου ξοδκιάζει τριάντα δκυό αλλά σοδκιάζει τράντα, στην φυλακήν τον παίρνουσιν τζαι εν του δκιούν αμάνταν!", english: "Who earns thirty-two and spends thirty is always a householder. Who spends thirty-two but earns thirty, they take him to prison and don't pity him!", note: "Live within your means or face consequences." },

                { greek: "Από 'σιει γείτον έσιει όσσιον τζι από 'σιει όσσιον τζοιμάται.", english: "Who has a neighbor has help, and who has help sleeps well.", note: "Good neighbors are valuable." },
                { greek: "Από 'ν έσιει νούν έσιει πόδκια.", english: "Who doesn't have brains has legs.", note: "Those who don't think must work harder." },

                { greek: "Απού Γερόκλιαρον αρνί, τζιαι κοκκορίφιν ρίφιν.", english: "From old lamb, and rooster billy goat.", note: "For good offspring, the male breeder should be young for goats but old for sheep." },

            "Β": [
                { greek: "Βουνόν με βουνόν εν σμίει.", english: "Mountain with mountain doesn't meet.", note: "But people can always meet; similar to 'mountains don't meet but people do.'" },

            "Δ": [
                { greek: "Δώσ'του πελλού λουκάνικον, να σου πει 'έν' ζαβόν'.", english: "Give him good sausage and he'll tell you 'it's soap'.", note: "Some people are never satisfied." },

                { greek: "Δώκε σσοινίν του χωρκάτη, να μπει με τες ποΐνες μες στο κρεβάτιν.", english: "Give rope to the peasant and he'll get in bed with his shoes on.", note: "Give someone too much freedom and they'll abuse it." },

                { greek: "Είπαν τον πελλόν, τζι επέλλανεν.", english: "They called him good and he went bad.", note: "Praise can spoil someone." },

                { greek: "Ένας παπάς δκυό εκκλησιές, της μιας γελά της.", english: "One priest, two churches - one is neglected.", note: "Doing too many things means something gets left behind." },

                { greek: "Έπαρ' τον εις τον γάμον σου να σου πει τζαι του γρόνου!", english: "Take him to your wedding so he can tell you about next year too!", note: "Said about someone who gives unwanted advice." },
                { greek: "Ετζύλησεν ο τέντζερης, τζαι ηύρεν το καππάτζιν.", english: "The pot rolled and found its lid.", note: "Every pot finds its lid; everyone finds their match." },

                { greek: "Εσυνάφερες τον ξένον, φερ' τζαι την τσαέραν του.", english: "You brought the stranger, bring his bag too.", note: "Accept the full consequences of your actions." },

            "Ε": [
                { greek: "Εσηκωστήκαν τα πόδκια να φατσίσουν πάς στην κκελέν.", english: "The feet stood up to slap the head.", note: "The world turned upside down; subordinates rebelling." },

        // Current filter state
        let currentCategory = 'all';
        let currentSearch = '';

        // Initialize app
        function init() {
            updateStats();
            renderCategories();
            renderProverbs();
            setupEventListeners();
        }

        // Update statistics
        function updateStats() {
            let total = 0;
            Object.values(proverbs).forEach(arr => total += arr.length);
            document.getElementById('totalCount').textContent = `${total} proverbs`;
        }

        // Render category navigation
        function renderCategories() {
            const nav = document.getElementById('categoryNav');
            const categories = Object.keys(proverbs).sort();

            nav.innerHTML = `
                <button onclick="filterByCategory('all')"
                    class="px-4 py-2 rounded-lg font-medium transition-all ${currentCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'}">
                    All
                </button>
                ${categories.map(cat => `
                    <button onclick="filterByCategory('${cat}')"
                        class="px-4 py-2 rounded-lg font-medium transition-all ${currentCategory === cat ? 'bg-indigo-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'}">
                        ${cat}
                    </button>
                `).join('')}
            `;
        }

        // Filter by category
        function filterByCategory(category) {
            currentCategory = category;
            renderCategories();
            renderProverbs();
        }

        // Render proverbs
        function renderProverbs() {
            const container = document.getElementById('proverbsContainer');
            const noResults = document.getElementById('noResults');

            let allProverbs = [];

            if (currentCategory === 'all') {
                Object.entries(proverbs).forEach(([letter, items]) => {
                    items.forEach(proverb => {
                        allProverbs.push({ ...proverb, letter });
                    });
                });
            } else {
                proverbs[currentCategory].forEach(proverb => {
                    allProverbs.push({ ...proverb, letter: currentCategory });
                });
            }

            // Filter by search
            if (currentSearch) {
                const searchLower = currentSearch.toLowerCase();
                allProverbs = allProverbs.filter(p => {
                    const greekMatch = p.greek.toLowerCase().includes(searchLower);
                    const englishMatch = p.english.toLowerCase().includes(searchLower);
                    const noteMatch = p.note?.toLowerCase().includes(searchLower);
                    return greekMatch || englishMatch || noteMatch;
                });
            }

            if (allProverbs.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            // Group by letter
            const grouped = {};
            allProverbs.forEach(p => {
                if (!grouped[p.letter]) grouped[p.letter] = [];
                grouped[p.letter].push(p);
            });

            container.innerHTML = Object.entries(grouped).map(([letter, items]) => `
                <div class="mb-8" id="category-${letter}">
                    <h2 class="text-2xl font-bold mb-4 text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-200 dark:border-indigo-800 pb-2">
                        ${letter}
                    </h2>
                    <div class="space-y-4">
                        ${items.map(proverb => renderProverbCard(proverb)).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Render individual proverb card
        function renderProverbCard(proverb) {
            return `
                <div class="proverb-card bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-5 shadow-sm">
                    <div class="space-y-3">
                        <div>
                            <p class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-2">
                                ${escapeHtml(proverb.greek)}
                            </p>
                            <p class="text-base text-indigo-700 dark:text-indigo-300 font-medium">
                                ${escapeHtml(proverb.english)}
                            </p>
                        </div>
                        ${proverb.note ? `
                            <p class="text-sm text-gray-600 dark:text-gray-400 italic pl-4 border-l-2 border-gray-300 dark:border-gray-600">
                                ${escapeHtml(proverb.note)}
                            </p>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Setup event listeners
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                renderProverbs();
            });
        }

        // Utility function
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Make functions globally accessible
        window.filterByCategory = filterByCategory;

        // Initialize on load
        init();
    </script>
</body>
</html>
